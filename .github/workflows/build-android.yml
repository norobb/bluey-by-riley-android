
name: Build Android

on:
  push:
    paths:
      - "bluey_app/android/**"
      - "bluey_app/lib/**"
      - "bluey_app/assets/**"
      - "bluey_app/test/**"
      - "bluey_app/pubspec.yaml"
      - "bluey_app/pubspec.lock"
      - "bluey_app/analysis_options.yaml"
      - "bluey_app/.metadata"
      - ".github/workflows/build-android.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bluey_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bluey-android-apk
          path: bluey_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
          
