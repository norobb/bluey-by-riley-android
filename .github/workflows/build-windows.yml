name: Build Windows

on:
  push:
    paths:
      - "bluey_app/windows/**"
      - "bluey_app/lib/**"
      - "bluey_app/assets/**"
      - "bluey_app/test/**"
      - "bluey_app/pubspec.yaml"
      - "bluey_app/pubspec.lock"
      - "bluey_app/analysis_options.yaml"
      - "bluey_app/.metadata"
      - ".github/workflows/build-windows.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows application
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bluey_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: bluey-windows-x64
          path: bluey_app/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
          
