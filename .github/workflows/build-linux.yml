name: Build Linux

on:
  push:
    paths:
      - "bluey_app/linux/**"
      - "bluey_app/lib/**"
      - "bluey_app/assets/**"
      - "bluey_app/test/**"
      - "bluey_app/pubspec.yaml"
      - "bluey_app/pubspec.lock"
      - "bluey_app/analysis_options.yaml"
      - "bluey_app/.metadata"
      - ".github/workflows/build-linux.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bluey_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Linux release
        run: flutter build linux --release

      - name: Upload Linux application
        uses: actions/upload-artifact@v4
        with:
          name: bluey-linux-x64
          path: bluey_app/build/linux/x64/release/bundle/
          if-no-files-found: error
          retention-days: 14
