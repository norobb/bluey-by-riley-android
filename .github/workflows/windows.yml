name: Windows CI Workflow

on:
  push:
    paths:
      - 'bluey_app/windows/**'
      - 'bluey_app/lib/**'
      - 'bluey_app/assets/**'
      - 'bluey_app/test/**'
      - 'bluey_app/pubspec.yaml'
      - 'bluey_app/pubspec.lock'
      - 'bluey_app/analysis_options.yaml'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'bluey_app/windows/**'
      - 'bluey_app/lib/**'
      - 'bluey_app/assets/**'
      - 'bluey_app/test/**'
      - 'bluey_app/pubspec.yaml'
      - 'bluey_app/pubspec.lock'
      - 'bluey_app/analysis_options.yaml'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build & Test Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: bluey_app

      - name: Analyze code
        run: flutter analyze
        working-directory: bluey_app

      - name: Run unit tests
        run: flutter test
        working-directory: bluey_app

      - name: Build Windows App
        run: flutter build windows --release
        working-directory: bluey_app

      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: bluey-app-windows
          path: bluey_app/build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 14
