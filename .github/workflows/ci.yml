name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to refresh the rolling latest-ci pre-release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME); Gradle fetches missing platforms itself.
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      # Pushes to main also build a release APK signed with the project's key (from repo secrets; absent on PRs).
      - name: Build signed release APK
        if: github.event_name == 'push'
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=bluey\nkeyPassword=%s\n' "$RUNNER_TEMP/release.jks" "$KEYSTORE_PW" "$KEYSTORE_PW" > keystore.properties
          ./gradlew --no-daemon :app:assembleRelease
          rm keystore.properties "$RUNNER_TEMP/release.jks"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -qi "27d7786beddaeb646a472a22efe755ec4f484f88d9903b6ac4f63215f2337b37"
      - uses: actions/upload-artifact@v4
        with:
          name: bluey-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # Fixed download link for the README button: every push to main replaces the APK in the latest-ci pre-release.
      - name: Publish to latest-ci pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk bluey-ci.apk
          git tag -f latest-ci "$GITHUB_SHA" && git push -f origin latest-ci
          gh release view latest-ci >/dev/null 2>&1 || gh release create latest-ci --prerelease --latest=false \
            --title "Latest CI build" --notes "APK from the newest commit on main, signed with the release key and rebuilt on every push."
          gh release upload latest-ci bluey-ci.apk --clobber
          gh release delete-asset latest-ci bluey-ci-debug.apk -y 2>/dev/null || true

  linux-host:
    name: Linux host tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: python -m unittest discover -s tests -v

  arch-package:
    name: Arch package
    needs: linux-host
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write  # to refresh the package in the latest-ci pre-release
    steps:
      # git must exist before checkout, or the checkout has no history for pkgver.
      - run: pacman -Syu --noconfirm --needed base-devel git github-cli python python-cryptography
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Build this exact commit with the same PKGBUILD as the AUR (dependencies aren't needed to build: -d).
      - name: Build package
        run: |
          git config --global --add safe.directory '*'
          useradd -m builder
          sudo -u builder git config --global --add safe.directory '*'
          install -d -o builder /tmp/build
          cp linux/packaging/aur/PKGBUILD linux/packaging/aur/bluey.install /tmp/build/
          sed -i "s|^source=.*|source=(\"bluey::git+file://$GITHUB_WORKSPACE#commit=$GITHUB_SHA\")|" /tmp/build/PKGBUILD
          chown builder /tmp/build/*
          cd /tmp/build && sudo -u builder makepkg -d --noconfirm
          cp /tmp/build/bluey-git-*.pkg.tar.zst "$GITHUB_WORKSPACE/bluey-git-latest-any.pkg.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: bluey-arch-package
          path: bluey-git-latest-any.pkg.tar.zst
      # Fixed link: sudo pacman -U https://github.com/<repo>/releases/download/latest-ci/bluey-git-latest-any.pkg.tar.zst
      - name: Publish to latest-ci pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-ci -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || sleep 120  # the Android job creates it on the first run
          gh release upload latest-ci bluey-git-latest-any.pkg.tar.zst --clobber -R "$GITHUB_REPOSITORY"
