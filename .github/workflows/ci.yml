name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to refresh the rolling latest-ci pre-release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME); Gradle fetches missing platforms itself.
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bluey-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # Fixed download link for the README button: every push to main replaces the APK in the latest-ci pre-release.
      - name: Publish to latest-ci pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk bluey-ci-debug.apk
          git tag -f latest-ci "$GITHUB_SHA" && git push -f origin latest-ci
          gh release view latest-ci >/dev/null 2>&1 || gh release create latest-ci --prerelease --latest=false \
            --title "Latest CI build" --notes "Debug APK from the newest commit on main, rebuilt on every push. For a signed build use the latest release."
          gh release upload latest-ci bluey-ci-debug.apk --clobber

  linux-host:
    name: Linux host tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: python -m unittest discover -s tests -v
